<div class="d-cap" id="d-cap" aria-live="polite"><b id="d-cap-t"></b><span id="d-cap-x"></span></div>
<style>.d-cap{position:fixed;left:0;top:0;z-index:50;width:260px;box-sizing:border-box;padding:10px 12px;background:#e1251b;font-size:13px;line-height:1.5;color:#fff;pointer-events:none;opacity:0;transition:opacity .25s}.d-cap.on{opacity:1}.d-cap b{display:block;font-weight:600;color:#fff}.d-cap span{display:block;color:#fff}@media (pointer:coarse){.d-cap{opacity:1;left:16px!important;top:auto!important;bottom:16px}}</style>
<script>/* 12주 갤러리 복사본: 마우스를 따라다니는 설명글로 그 묶음의 설명을 단다 (4주 기획 01_topic의 학생 말) */
(()=>{const T={"midnight-sun":["하늘","Zara Larsson의 노래 'Midnight Sun'에서 영감받은 일몰 해변가 사진 위주로 골랐다."],"born-this-way":["손","주로 혼자인 손, 아티스틱한 손 — 네일아트를 한 여성·남성의 손, 플래시로 찍은 흑백 사진의 손도 담았다."],"say-so":["길","사람이 많은 여행지의 길, 각 나라 고유의 전통적인 길, 가보고 싶은 길들을 골랐다."]};
const cap=document.getElementById("d-cap"),t=document.getElementById("d-cap-t"),x=document.getElementById("d-cap-x");
function up(){const it=document.querySelector(".d-item.is-center");if(!it)return;const k=T[it.dataset.key]||["",""];t.textContent=k[0];x.textContent=k[1];}
let mx=-1,my=-1;function place(){if(mx<0)return;const w=cap.offsetWidth,h=cap.offsetHeight;let L=mx+18,Tp=my+20;if(L+w>innerWidth-12)L=mx-18-w;if(Tp+h>innerHeight-12)Tp=my-20-h;cap.style.left=L+"px";cap.style.top=Tp+"px";}
addEventListener("pointermove",(e)=>{mx=e.clientX;my=e.clientY;cap.classList.add("on");place();});document.addEventListener("pointerleave",()=>cap.classList.remove("on"));
new MutationObserver(()=>setTimeout(up,450)).observe(document.getElementById("d-song"),{childList:true,characterData:true,subtree:true,attributes:true});
addEventListener("resize",up);addEventListener("load",()=>setTimeout(up,600));setInterval(up,800);})();</script>
