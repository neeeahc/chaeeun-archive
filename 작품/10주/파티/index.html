<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>西門 Ximen — 이채은</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&family=Gothic+A1:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700&text=%E8%A5%BF%E9%96%80&display=swap" rel="stylesheet">
<!-- 12주 갤러리용 10주 페이지: 내가 앨범을 낸다면 — 앨범 「西門 Ximen」.
     닫힌 CD 케이스를 누르면 뚜껑이 열리고, 옆으로 앨범과 같은 크기의 트랙리스트 속지가 나온다.
     곡 제목을 누르면 뚜껑 안쪽에서 YouTube 음원이 재생된다.
     앨범 아트 · CD · 속지 그래픽은 회색 종이 위 빨간 점을 이어 붙인 하프톤으로 새로 그린 것이다(다른 앨범 아트를 쓰지 않는다).
     글꼴 Coolvetica(Typodermic)는 fonts/ 안의 파일을 쓴다 -->
<style>
@font-face{font-family:"Coolvetica";src:url("fonts/coolvetica-rg.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Coolvetica Cond";src:url("fonts/coolvetica-condensed-rg.otf") format("opentype");font-weight:400;font-display:swap}
:root{--bg:#2b2b2b;--paper:#d3d7dc;--ink:#1c1c1c;--mute:#6d6c69;--red:#e1251b;--s:360px;--w:calc(var(--s)*1.1);--g:28px;--top:80px;--ease:cubic-bezier(.65,0,.25,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Inter Tight","Gothic A1",sans-serif}
body{overflow:hidden}
body.v{overflow-x:hidden;overflow-y:auto}
.cjk{font-family:"Noto Sans TC","Gothic A1",sans-serif;font-weight:700}
.cv{font-family:"Coolvetica","Inter Tight",sans-serif;font-weight:400}
.stage{position:relative;width:100%;height:100%;perspective:2200px}
body.v .stage{height:var(--sh,100%)}
/* 케이스 · 속지는 같은 크기, 같은 자리에서 시작한다 */
.case,.sheet{position:absolute;left:calc(50% - var(--w)/2);top:var(--top);width:var(--w);height:var(--s)}
.case{z-index:2;transform-style:preserve-3d;cursor:pointer;transition:top .8s var(--ease)}
.is-open .case{cursor:default}
.tray{position:absolute;inset:0;border-radius:6px;background:linear-gradient(135deg,#3a3a3a,#1d1d1d);box-shadow:0 30px 60px -20px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.14)}
.tray::before{content:"";position:absolute;left:6%;top:4%;right:2%;bottom:4%;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.hub{position:absolute;left:calc(53% - var(--s)*.09);top:calc(50% - var(--s)*.09);width:calc(var(--s)*.18);height:calc(var(--s)*.18);border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.18) 0 4deg,transparent 4deg 12deg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.disc{position:absolute;left:calc(53% - var(--s)*.44);top:calc(50% - var(--s)*.44);width:calc(var(--s)*.88);height:calc(var(--s)*.88);border-radius:50%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.disc canvas{width:100%;height:100%;display:block;border-radius:50%}
.disc.spin{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 뚜껑: 왼쪽 경첩을 축으로 열린다(세로 화면은 위로). 앞면 = 앨범 아트, 안쪽 = 지금 재생 중 */
.lid{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;transition:transform 1.15s var(--ease);transform:translateZ(2px)}
.face{position:absolute;inset:0;border-radius:6px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front canvas{position:absolute;left:6%;top:0;width:94%;height:100%;display:block}
.front .hinge{position:absolute;left:0;top:0;bottom:0;width:6%;background:linear-gradient(90deg,#9a9995,#c9c8c4 40%,#a9a8a4);box-shadow:inset -1px 0 0 rgba(0,0,0,.25)}
.gloss{position:absolute;inset:0;border-radius:6px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 62%,rgba(255,255,255,.14) 74%,rgba(255,255,255,0) 86%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),inset 0 0 0 3px rgba(0,0,0,.06)}
.inside{transform:rotateY(180deg);background:var(--paper)}
.inside canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.np{position:absolute;inset:0;padding:calc(var(--s)*.055) calc(var(--s)*.055) calc(var(--s)*.09);display:flex;flex-direction:column;gap:6px}
.np .k{font:600 12px/1 "Inter Tight";letter-spacing:.12em;color:var(--red)}
.np h2{margin:4px 0 0;font:400 calc(var(--s)*.075)/1.3 "Coolvetica","Inter Tight",sans-serif;letter-spacing:.005em}
.np .a{margin:-6px 0 0;font:400 13px/1.4 "Inter Tight";color:var(--mute)}
.np .why{margin:4px 0 0;font:400 13px/1.55 "Gothic A1";color:#3b3a38}
.np .row{display:flex;align-items:flex-end;gap:12px;margin-top:auto}
.np .yt{position:relative;width:62%;aspect-ratio:16/9;background:#111;border-radius:2px;overflow:hidden;flex:none}
.np .yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.np .yt:empty{display:none}
.np .hint{margin:auto 0 0;font:400 13px/1.5 "Gothic A1";color:var(--mute)}
.np [hidden]{display:none!important}
.np a{font:600 12px/1.4 "Inter Tight";letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
/* 속지: 앨범과 같은 크기. 케이스 뒤에서 오른쪽(세로 화면에서는 아래)으로 미끄러져 나온다 */
.sheet{z-index:1;background:var(--paper);border-radius:2px;overflow:hidden;box-shadow:0 24px 50px -20px rgba(0,0,0,.6);transform:scale(.96);opacity:0;transition:transform 1s var(--ease),opacity .3s,top .8s var(--ease)}
.is-open .sheet{opacity:1;transform:translateX(calc(var(--w) + var(--g)));transition-delay:.55s,.5s,0s}
body.v .is-open .sheet{transform:translateY(calc(var(--s) + var(--g)))}
.inside>canvas,.inside svg.deco,.sheet>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.inside .in{position:absolute;inset:0;padding:calc(var(--s)*.05) calc(var(--w)*.24) calc(var(--s)*.045) calc(var(--s)*.055);display:flex;flex-direction:column}
.bar{display:flex;align-items:flex-end;gap:10px;margin-bottom:calc(var(--s)*.03)}
.bar .bc{display:flex;flex-direction:column;align-items:center;gap:2px}
.bar .bc svg{height:calc(var(--s)*.07);width:auto}
.bar .bc span{font:400 8px/1 "Inter Tight";letter-spacing:.08em}
.bar .t{font:400 12px/1.25 "Inter Tight";letter-spacing:.03em}
.bar .t b{display:block;font:400 calc(var(--s)*.048)/1.1 "Coolvetica","Inter Tight",sans-serif;letter-spacing:.01em}
.tracks{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.tracks button{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:6px;width:100%;cursor:pointer;white-space:nowrap}
.tracks .n{flex:none;width:18px;font:400 11px/1 "Inter Tight";color:#3b3a38}
.tracks .tt{font:400 calc(var(--s)*.085)/1 "Coolvetica","Inter Tight",sans-serif;letter-spacing:-.005em;color:var(--ink);transition:color .2s}
.tracks .ar{font:400 max(13px,calc(var(--s)*.036))/1 "Coolvetica","Inter Tight",sans-serif;color:var(--ink);letter-spacing:.01em;transition:color .2s}
.tracks .sub{font-size:max(13px,calc(var(--s)*.036));margin-right:2px}
.tracks button:hover .tt,.tracks button:hover .ar,.tracks button:focus-visible .tt,.tracks li.on .tt,.tracks li.on .ar{color:var(--red)}
.tracks button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tracks li.on .n{color:var(--red)}
/* 타이틀곡 IYKYK: 제목을 하프톤 그래픽으로 */
.tracks .main canvas{display:block;height:calc(var(--s)*.13);width:auto;transition:filter .2s}
.tracks .main:hover canvas,.tracks li.on .main canvas{filter:brightness(.8)}
.tracks .tag{font:600 9px/1 "Inter Tight";letter-spacing:.14em;color:var(--red);border:1px solid var(--red);padding:3px 4px 2px;border-radius:2px;align-self:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.foot{margin:calc(var(--s)*.03) 0 0;font:400 9px/1.45 "Inter Tight";letter-spacing:.05em;color:#3b3a38;text-transform:uppercase}
/* 안내 · 닫기 */
.cue{position:absolute;left:0;right:0;top:calc(var(--top) + var(--s) + 22px);margin:0;text-align:center;font:600 12px/1 "Inter Tight";letter-spacing:.2em;color:rgba(255,255,255,.6);transition:opacity .4s}
.cue i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:10px;vertical-align:1px;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
.is-open .cue{opacity:0;pointer-events:none}
.close{all:unset;position:fixed;right:20px;top:16px;z-index:5;cursor:pointer;font:600 12px/1 "Inter Tight";letter-spacing:.14em;color:rgba(255,255,255,.7);opacity:0;pointer-events:none;transition:opacity .4s}
.close:hover{color:#fff}
body.v .close{right:12px;top:10px;padding:8px 10px;border-radius:3px;background:rgba(43,43,43,.88)}
body.opened .close{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <section class="sheet" id="sheet" aria-label="지금 재생 중"><canvas id="cvLiner"></canvas>
    <div class="np" aria-live="polite">
      <span class="k" id="npk">西門 Ximen · 5 TRACKS</span>
      <h2 id="npt">Select a track</h2>
      <p class="a" id="npa">Chaeeun Lee</p>
      <p class="why" id="npw" hidden></p>
      <p class="hint" id="nph">트랙리스트에서 곡 제목을 누르면 여기서 재생됩니다.</p>
      <div class="row" id="nprow" hidden><div class="yt" id="yt"></div><a id="npl" href="#" target="_blank" rel="noopener">YouTube에서<br>열기 ↗</a></div>
    </div>
  </section>
  <div class="case" id="case" role="button" tabindex="0" aria-label="앨범 西門 Ximen 열기">
    <div class="tray"><div class="hub"></div><div class="disc" id="disc"><canvas id="cvDisc"></canvas></div></div>
    <div class="lid" id="lid">
      <div class="face front"><div class="hinge"></div><canvas id="cvCover"></canvas><div class="gloss"></div></div>
      <div class="face inside" id="inside">
        <canvas id="cvSheet"></canvas>
        <svg class="deco" id="deco" aria-hidden="true"></svg>
        <div class="in">
          <div class="bar">
            <div class="bc"><svg id="barcode" viewBox="0 0 90 30" aria-hidden="true"></svg><span>( 2026 1125 )</span></div>
            <div class="t"><b><span class="cjk">西門</span> Ximen</b>Chaeeun Lee · 5 tracks</div>
          </div>
          <ol class="tracks" id="tracks"></ol>
          <p class="foot">(P)(C) 2026 Chaeeun Lee — 내가 앨범을 낸다면 담을 다섯 곡<br>곡 제목을 누르면 재생됩니다</p>
        </div>
      </div>
    </div>
  </div>
  <p class="cue"><i></i>CLICK TO OPEN</p>
</div>
<button class="close" id="close" type="button">CLOSE</button>
<script>
(function(){
var SONGS=[
 {t:"prism",a:"m-flo",y:"Jg63poh9qTs",x:"내 앨범을 낸다면 어떤 곡을 담을지를 기준으로 골랐습니다. 이 곡은 앨범의 문을 여는 인트로로 두면 딱 좋을 것 같아 첫 곡으로 넣었습니다."},
 {t:"Starry Night",a:"Peggy Gou",y:"r_wwmmo6UGY",x:"인트로가 문을 열면, 두 번째 곡에서는 리듬을 올려 앨범의 분위기를 본격적으로 띄우고 싶었습니다. 그래서 몸이 먼저 반응하는 이 곡을 바로 뒤에 두었습니다."},
 {t:"nice",a:"2hollis",y:"nnzndZQX3SU",x:"두 번째 곡에서 올린 분위기를 끊지 않고 이어가고 싶었습니다. 그래서 클럽에서 그대로 이어 틀 수 있는 이 곡을 세 번째에 두었습니다."},
 {t:"IYKYK",a:"XG",y:"QiYOkmrI1jg",main:1,x:"인트로와 분위기가 이어지면서도 앨범에서 가장 타이틀곡 같은 곡입니다. 그래서 앨범의 중심이 되는 네 번째 자리에 두었습니다."},
 {t:"NO PAIN",sub:"(Fire-Toolz Remix)",a:"Silica Gel",y:"ULJzPOnOeU0",x:"앨범을 닫는 엔딩 같은 아웃트로 곡입니다. 인트로로 연 앨범을 이 곡으로 마무리하고 싶어 마지막 자리에 두었습니다."}
];
var $=function(id){return document.getElementById(id)};
var RED=[225,37,27],PAPER="#d3d7dc",DISCBG="#c9ced4",CV='"Coolvetica","Inter Tight",sans-serif';
var root=document.documentElement,body=document.body,stage=$("stage");

/* ---------- 이어 붙인 점 하프톤 ----------
   칸마다 점을 찍고, 이웃 칸이 함께 차 있으면 다리로 잇는다. 4×4 바이어 무늬로 칸을 조금씩 비워 구멍을 낸다.
   끝으로 살짝 흐린 뒤 문턱을 넘긴 곳만 남겨 다리와 점이 매끈하게 붙는다 */
function hh(i,j,s){var v=Math.sin(i*127.1+j*311.7+s*74.7)*43758.5453;return v-Math.floor(v)}
function sm(t){return t*t*(3-2*t)}
function vn(x,y,s){var i=Math.floor(x),j=Math.floor(y),fx=sm(x-i),fy=sm(y-j);var a=hh(i,j,s),b=hh(i+1,j,s),c=hh(i,j+1,s),d=hh(i+1,j+1,s);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
function fbm(x,y,s){return vn(x,y,s)*.55+vn(x*2.1,y*2.1,s+3)*.3+vn(x*4.3,y*4.3,s+7)*.15}
function cl(v){return v<0?0:v>1?1:v}
function band(y,a,b,e){return cl((y-a)/e)*cl((b-y)/e)}
var BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
var FILTER=(function(){try{var c=document.createElement("canvas").getContext("2d");c.filter="blur(2px)";return c.filter==="blur(2px)"}catch(e){return false}})();
/* 글자·모양을 0~1 값으로 읽는 판 */
function mask(MW,MH,drawFn){MW=Math.max(8,Math.round(MW));MH=Math.max(8,Math.round(MH));var c=document.createElement("canvas");c.width=MW;c.height=MH;var x=c.getContext("2d");x.fillStyle="#000";drawFn(x,MW,MH);var d=x.getImageData(0,0,MW,MH).data;return function(u,v){var i=Math.min(MW-1,Math.max(0,u*MW|0)),j=Math.min(MH-1,Math.max(0,v*MH|0));return d[(j*MW+i)*4+3]/255}}
/* 글자 사이를 조금 띄워 점이 이웃 글자와 붙지 않게 한다 */
function fit(x,str,font,cx,cy,maxW,maxH,bold,track){track=track||.07;var ch=str.split("");
  function wid(sz){x.font=font.replace("S",sz+"px");var w=0;ch.forEach(function(c){w+=x.measureText(c).width});return w+sz*track*(ch.length-1)}
  var size=Math.min(maxH*1.35,maxW/wid(100)*100),w=wid(size);x.textAlign="left";x.textBaseline="middle";var px=cx-w/2;
  var xh=x.measureText("x").actualBoundingBoxAscent||size*.25;
  ch.forEach(function(c){var cw=x.measureText(c).width;
    /* 소문자 i: 점이 줄기에 붙지 않게 줄기와 점을 따로, 사이를 띄워 그린다 */
    if(c==="i"){var sw=size*.13,top=cy-xh,bot=cy+x.measureText("x").actualBoundingBoxDescent;x.fillRect(px+cw/2-sw/2,top,sw,bot-top+(bold?0:0));var r=sw*.62;x.beginPath();x.arc(px+cw/2,top-size*.13-r,r,0,6.2832);x.fill()}
    else{x.fillText(c,px,cy);if(bold){x.lineWidth=size*bold;x.lineJoin="round";x.strokeStyle="#000";x.strokeText(c,px,cy)}}
    px+=cw+size*track})}
/* L: {step(칸 크기, 폭 대비), f(u,v) 0~1, r 점 반지름, b 다리 굵기, gain, seed} */
function net(ox,PW,PH,W,L){
  var st=L.step*W*(PW/W),cols=Math.ceil(PW/st),rows=Math.ceil(PH/st),occ=new Uint8Array(cols*rows),val=new Float32Array(cols*rows),g=L.gain||.9;
  for(var j=0;j<rows;j++)for(var i=0;i<cols;i++){var m=L.f((i+.5)*st/PW,(j+.5)*st/PH)*g,t=.22+BAYER[(j&3)*4+(i&3)]/16*.82;val[j*cols+i]=m;occ[j*cols+i]=m>t?1:0}
  var R=st*(L.r||.42),B=st*(L.b||.26);ox.fillStyle=ox.strokeStyle="#000";ox.lineCap="round";
  function O(i,j){return i>=0&&j>=0&&i<cols&&j<rows&&occ[j*cols+i]}
  for(j=0;j<rows;j++)for(i=0;i<cols;i++){
    var x=(i+.5)*st,y=(j+.5)*st,k=j*cols+i;
    if(occ[k]){
      ox.beginPath();ox.arc(x,y,R,0,6.2832);ox.fill();
      ox.lineWidth=B;
      if(O(i+1,j)){ox.beginPath();ox.moveTo(x,y);ox.lineTo(x+st,y);ox.stroke()}
      if(O(i,j+1)){ox.beginPath();ox.moveTo(x,y);ox.lineTo(x,y+st);ox.stroke()}
      ox.lineWidth=B*.8;
      if(O(i+1,j+1)&&!O(i+1,j)&&!O(i,j+1)){ox.beginPath();ox.moveTo(x,y);ox.lineTo(x+st,y+st);ox.stroke()}
      if(O(i-1,j+1)&&!O(i-1,j)&&!O(i,j+1)){ox.beginPath();ox.moveTo(x,y);ox.lineTo(x-st,y+st);ox.stroke()}
    }else if(val[k]>.12){ox.beginPath();ox.arc(x,y,R*Math.min(.85,.35+val[k]*.6),0,6.2832);ox.fill()}
  }
  return st;
}
/* 일반 하프톤: 칸마다 점 하나, 값이 클수록 점이 커진다(잇지 않는다). shape "sq"는 둥근 네모 */
function dots(ctx,PW,PH,W,L){var st=L.step*PW,c=L.color||RED;
  for(var y=st/2;y<PH+st/2;y+=st)for(var x=st/2;x<PW+st/2;x+=st){var v=cl(L.f(x/PW,y/PH));if(v<.06)continue;
    var a=(L.alpha||1)*(L.fade?(1-L.fade*cl((v-.7)/.3)):1);ctx.fillStyle="rgba("+c[0]+","+c[1]+","+c[2]+","+a.toFixed(3)+")";
    var r=st*.5*Math.min(1,.18+v*.86);ctx.beginPath();
    if(L.shape==="sq"){var q=r*.95,k=r*.42;if(ctx.roundRect)ctx.roundRect(x-q,y-q,q*2,q*2,k);else ctx.rect(x-q,y-q,q*2,q*2)}else ctx.arc(x,y,r,0,6.2832);
    ctx.fill()}}
/* 빛줄기: 한 점에서 여러 갈래로 뻗는 들쭉날쭉한 줄기 */
function burst(ox,oy,rays,seed){return function(u,v){var dx=u-ox,dy=v-oy,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx),m=0;
  for(var k=0;k<rays.length;k++){var R=rays[k],ang=R[0]*Math.PI/180+(fbm(r*5,k*3.1,seed)-.5)*.35/Math.max(.15,r);var d=Math.atan2(Math.sin(a-ang),Math.cos(a-ang));if(Math.abs(d)>1.2)continue;
    var per=Math.abs(Math.sin(d))*r,w=R[1]*(.7+fbm(r*8,k,seed+1)*.6);var lump=cl((fbm(r*7,k*2.3,seed+2)-.2)*2);m=Math.max(m,Math.exp(-Math.pow(per/w,2))*lump*cl((R[2]-r)/.12))}
  return cl(m+Math.exp(-Math.pow(r/.05,2))*1.1)}}
/* 한 장 그리기: 바탕 → 층마다 그물 → 매끈하게 → 빨강 → 종이 결 */
function paint(cv,W,H,bg,layers,after){
  var dpr=Math.min(2,window.devicePixelRatio||1),PW=Math.round(W*dpr),PH=Math.round(H*dpr);
  cv.width=PW;cv.height=PH;var ctx=cv.getContext("2d");
  if(bg){ctx.fillStyle=bg;ctx.fillRect(0,0,PW,PH)}
  layers.forEach(function(L){
    if(L.mode==="dots"){dots(ctx,PW,PH,W,L);return}
    var o=document.createElement("canvas");o.width=PW;o.height=PH;var ox=o.getContext("2d");
    var st=net(ox,PW,PH,W,L);
    var t=document.createElement("canvas");t.width=PW;t.height=PH;var tx=t.getContext("2d");
    if(FILTER)tx.filter="blur("+Math.max(.6,st*.14)+"px)";tx.drawImage(o,0,0);
    var im=tx.getImageData(0,0,PW,PH),d=im.data,th=FILTER?128:1;
    for(var i=0;i<d.length;i+=4){if(d[i+3]>=th){d[i]=RED[0];d[i+1]=RED[1];d[i+2]=RED[2];d[i+3]=255}else d[i+3]=0}
    tx.putImageData(im,0,0);ctx.drawImage(t,0,0);
  });
  if(bg){var g=ctx.getImageData(0,0,PW,PH),gd=g.data;for(var i=0;i<gd.length;i+=4){var n=(Math.random()-.5)*14;gd[i]+=n;gd[i+1]+=n;gd[i+2]+=n}ctx.putImageData(g,0,0)}
  if(after)after(ctx,PW,PH,dpr);
}

function draw(){
  var S=parseFloat(getComputedStyle(root).getPropertyValue("--s")),W=S*1.1;
  /* 앨범 앞면: 위 큰 그물 → 가운데 Ximen → 아래 西門(고운 그물) */
  var cw=W*.94,ch=S;
  var mX=mask(cw,ch,function(x,w,h){fit(x,"Ximen","400 S "+CV,w*.5,h*.56,w*.9,h*.3,.035)});
  var mK=mask(cw,ch,function(x,w,h){fit(x,"西門",'700 S "Noto Sans TC","Gothic A1"',w*.5,h*.83,w*.9,h*.14,.02)});
  paint($("cvCover"),cw,ch,PAPER,[
    {mode:"dots",step:1/64,color:[236,142,134],f:burst(.8,.22,[[182,.011,.95],[166,.016,.9],[147,.013,1.05],[131,.018,1.1],[112,.012,.8],[94,.01,.85],[214,.01,.55],[262,.009,.4],[300,.009,.35],[48,.01,.5]],21)},
    {step:1/50,f:mX},
    {step:1/76,f:mK}
  ],function(c,PW,PH,dpr){c.fillStyle="#1c1c1c";c.font=(12*dpr)+"px "+CV;c.textBaseline="alphabetic";c.textAlign="left";c.fillText("Chaeeun Lee",14*dpr,PH-12*dpr);c.textAlign="right";c.fillText("Ximen · 2026",PW-14*dpr,PH-12*dpr)});
  /* CD: 가운데서 뻗어 나가는 그물 줄기 */
  var D=S*.88;
  paint($("cvDisc"),D,D,DISCBG,[
    {step:1/40,gain:1,f:function(u,v){var x=u-.5,y=v-.5,r=Math.hypot(x,y),a=Math.atan2(y,x);var ray=Math.pow(Math.max(0,Math.cos(a*6+fbm(r*4,a*.6,2)*2.2)),8);return cl(ray*1.4*band(r,.21,.47,.05)*(1.15-r))}}
  ],function(x,PW,PH){var R=PW/2;x.globalCompositeOperation="destination-in";x.beginPath();x.arc(R,R,R,0,6.2832);x.arc(R,R,R*.08,0,6.2832,true);x.fill("evenodd");x.globalCompositeOperation="source-over";
    var g=x.createRadialGradient(R,R,R*.08,R,R,R*.2);g.addColorStop(0,"rgba(255,255,255,.6)");g.addColorStop(1,"rgba(190,190,190,.4)");x.fillStyle=g;x.beginPath();x.arc(R,R,R*.2,0,6.2832);x.arc(R,R,R*.08,0,6.2832,true);x.fill("evenodd");
    x.fillStyle="#1c1c1c";x.textAlign="center";x.textBaseline="middle";x.font=(PW*.045)+"px "+CV;x.fillText("Ximen",R,R-R*.28);x.font="700 "+(PW*.034)+"px 'Noto Sans TC'";x.fillText("西門",R,R+R*.28)});
  /* 뚜껑 안쪽: 아래쪽에 옅은 그물 */
  paint($("cvLiner"),W,S,PAPER,[]);
  drawSheet(S,W);
}
/* 속지 배경: 오른쪽 세로 Ximen + 별 + 손 낙서 + 2026 도장 */
function drawSheet(S,W){
  var SW=W,SH=S;
  var mV=mask(SW,SH,function(x,w,h){x.save();x.translate(w*.885,h*.5);x.rotate(-Math.PI/2);fit(x,"Ximen","400 S "+CV,0,0,h*.92,w*.19,.035);x.restore()});
  var mS=mask(SW,SH,function(x,w,h){var cx=w*.6,cy=h*.47,R=h*.1,r=h*.024;x.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,q=i%2?r:R;x.lineTo(cx+Math.cos(a)*q*(i%4===0?1.2:1),cy+Math.sin(a)*q)}x.closePath();x.fill()});
  paint($("cvSheet"),SW,SH,PAPER,[{step:1/66,f:mV},{step:1/70,gain:1,f:mS}]);
  /* 손 낙서 · 도장 (SVG) */
  var s=$("deco");s.setAttribute("viewBox","0 0 "+SW+" "+SH);
  var X=function(a){return (a*SW).toFixed(1)},Y=function(a){return (a*SH).toFixed(1)};
  var p="M"+X(.86)+" "+Y(.05)+" C"+X(.9)+" "+Y(.14)+" "+X(.78)+" "+Y(.16)+" "+X(.83)+" "+Y(.24)+" S"+X(.94)+" "+Y(.3)+" "+X(.86)+" "+Y(.38)+" C"+X(.8)+" "+Y(.44)+" "+X(.9)+" "+Y(.5)+" "+X(.84)+" "+Y(.55)+" C"+X(.79)+" "+Y(.6)+" "+X(.95)+" "+Y(.6)+" "+X(.88)+" "+Y(.68)+" C"+X(.83)+" "+Y(.74)+" "+X(.9)+" "+Y(.8)+" "+X(.86)+" "+Y(.86)+" C"+X(.84)+" "+Y(.9)+" "+X(.8)+" "+Y(.88)+" "+X(.82)+" "+Y(.84)+" S"+X(.9)+" "+Y(.86)+" "+X(.87)+" "+Y(.96);
  var st=[[.6,.19,-4],[.73,.35,3],[.93,.06,-6],[.95,.75,-2]];
  var out='<path d="'+p+'" fill="none" stroke="#1c1c1c" stroke-width="1" stroke-linecap="round"/>';
  out+='<circle cx="'+X(.83)+'" cy="'+Y(.24)+'" r="5" fill="none" stroke="#1c1c1c" stroke-width="1"/>';
  st.forEach(function(q){out+='<text x="'+X(q[0])+'" y="'+Y(q[1])+'" transform="rotate('+q[2]+' '+X(q[0])+' '+Y(q[1])+')" font-family="Coolvetica Cond, Inter Tight, sans-serif" font-size="'+Math.max(10,S*.032).toFixed(1)+'" fill="#1c1c1c" opacity=".7">2026</text>'});
  s.innerHTML=out;
}
/* 타이틀곡 제목: IYKYK를 하프톤으로 */
var mainCv=null;
function drawMain(S){if(!mainCv)return;var H=S*.13,W=H*3.1;
  var mT=mask(W,H,function(x,w,h){fit(x,"IYKYK","400 S "+CV,w*.5,h*.54,w*.96,h*.86,.04)});
  paint(mainCv,W,H,null,[{step:1/60,f:mT}]);mainCv.style.width=W+"px";mainCv.style.height=H+"px"}

/* ---------- 바코드 ---------- */
(function(){var s=$("barcode"),x=0,out="",seed=[2,1,3,1,1,2,1,3,2,1,1,2,3,1,2,1,1,3,1,2,2,1,3,1,1,2,1,1,3,2];seed.forEach(function(w,i){if(i%2===0)out+='<rect x="'+x+'" y="0" width="'+w+'" height="30" fill="#1c1c1c"/>';x+=w+1});s.setAttribute("viewBox","0 0 "+x+" 30");s.innerHTML=out})();

/* ---------- 트랙리스트 ---------- */
var list=$("tracks");
SONGS.forEach(function(s,i){var li=document.createElement("li");var b=document.createElement("button");b.type="button";
  var n='<span class="n">'+String(i+1).padStart(2,"0")+'</span>';
  if(s.main){b.className="main";b.innerHTML=n+'<span class="tt"></span><span class="ar"></span>';b.querySelector(".tt").textContent=s.t}
  else{b.innerHTML=n+'<span class="tt"></span>'+(s.sub?'<span class="ar sub"></span>':'')+'<span class="ar"></span>';b.querySelector(".tt").textContent=s.t;if(s.sub)b.querySelector(".sub").textContent=s.sub}
  b.querySelector(".ar:not(.sub)").textContent=s.a;
  b.addEventListener("click",function(){play(i)});li.appendChild(b);list.appendChild(li)});
function full(s){return s.t+(s.sub?" "+s.sub:"")}
function play(i){var s=SONGS[i];
  [].forEach.call(list.children,function(li,j){li.classList.toggle("on",j===i)});
  $("npk").textContent="NOW PLAYING · "+String(i+1).padStart(2,"0")+" / 05";$("npt").textContent=full(s);$("npa").textContent=s.a;
  $("npw").textContent=s.x;$("npw").hidden=false;$("nph").hidden=true;$("nprow").hidden=false;
  $("yt").innerHTML='<iframe src="https://www.youtube.com/embed/'+s.y+'?autoplay=1&rel=0&playsinline=1" title="'+(full(s)+" — "+s.a).replace(/"/g,"")+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
  $("npl").href="https://www.youtube.com/watch?v="+s.y;
  $("disc").classList.add("spin");
  if(body.classList.contains("v"))setTimeout(function(){$("sheet").scrollIntoView({behavior:"smooth",block:"center"})},50);
}
function stop(){$("yt").innerHTML="";$("disc").classList.remove("spin");[].forEach.call(list.children,function(li){li.classList.remove("on")});
  $("npk").textContent="西門 Ximen · 5 TRACKS";$("npt").textContent="Select a track";$("npa").textContent="Chaeeun Lee";$("npw").hidden=true;$("nph").hidden=false;$("nprow").hidden=true}

/* ---------- 열기 · 닫기 ---------- */
var open=false;
function setOpen(o){open=o;stage.classList.toggle("is-open",o);body.classList.toggle("opened",o);$("case").setAttribute("aria-label",o?"앨범 西門 Ximen":"앨범 西門 Ximen 열기");if(!o)stop();layout();window.scrollTo({top:0,behavior:"smooth"})}
$("case").addEventListener("click",function(){if(!open)setOpen(true)});
$("case").addEventListener("keydown",function(e){if(!open&&(e.key==="Enter"||e.key===" ")){e.preventDefault();setOpen(true)}});
$("close").addEventListener("click",function(){setOpen(false)});

/* ---------- 크기 · 배치 ---------- */
var lastS=0;
function layout(){
  var vw=innerWidth,vh=innerHeight,v=vw<760,g=v?18:28,S;
  S=v?Math.min(vw*.92/1.1,vh*.6):Math.min((vw*.94-2*g)/3.3,vh*.72);
  S=Math.max(220,Math.floor(S));
  body.classList.toggle("v",v);
  root.style.setProperty("--s",S+"px");root.style.setProperty("--g",g+"px");
  var top;
  if(!v)top=Math.max(16,(vh-S)/2);
  else if(open){top=56+S;stage.style.setProperty("--sh",(top+2*S+g+40)+"px")}
  else{top=Math.max(16,(vh-S)/2-20);stage.style.setProperty("--sh",vh+"px")}
  root.style.setProperty("--top",top+"px");
  /* 가로 화면: 뚜껑이 왼쪽으로, 세로 화면: 위로 열린다 */
  var lid=$("lid");
  lid.style.transformOrigin=v?"50% 0":"0 50%";
  lid.style.transform=open?(v?"translateZ(2px) rotateX(180deg)":"translateZ(2px) rotateY(-180deg)"):"translateZ(2px)";
  $("inside").style.transform=v?"rotateX(180deg)":"rotateY(180deg)";
  if(S!==lastS){lastS=S;draw()}
}
var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){lastS=0;layout()},150)});
var ready=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('40px "Coolvetica"'),document.fonts.load('40px "Coolvetica Cond"'),document.fonts.load('700 40px "Noto Sans TC"',"西門")]):Promise.resolve();
ready.catch(function(){}).then(function(){lastS=0;layout()});
layout();
})();
</script>
