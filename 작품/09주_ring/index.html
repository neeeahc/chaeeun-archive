<!-- 12주 갤러리용: 5주 사이트(07 폴더 판)의 근거 사진 3D 링 + 크게 보기 팝업을 그대로 옮겨 9주 말 다섯 장을 넣었다 -->
<style>
:root{--doja-black:#000000} html,body{margin:0;background:#000;color:#fff} *{box-sizing:border-box}
.dj-ring-section { height: 300vh; background: var(--doja-black); color: #FFFFFF; }   /* 끝까지 내리면 한 바퀴 */
.dj-ring-stage {
  position: sticky; top: 0; height: 100vh; overflow: hidden;
  perspective: 1100px; perspective-origin: 50% 50%;
  display: grid; place-items: center;
}
.dj-ring { position: relative; width: var(--dj-card-w); height: 1px; transform-style: preserve-3d; --dj-card-w: clamp(170px, 18vw, 340px); }   /* 13vw → 18vw: 사진은 크게, 사이 간격은 좁게 */
.dj-card { position: absolute; left: 0; top: 0; width: var(--dj-card-w); margin: 0; translate: 0 -50%; transform-origin: 50% 50%; }
.dj-card img { display: block; width: 100%; height: auto; max-height: none; aspect-ratio: auto; object-fit: contain; }   /* 자르지 않고 원본 비율 그대로 줄임 */
.dj-ring-note {
  position: absolute; left: 16px; bottom: 20px; display: flex; gap: 4px; align-items: baseline;
  font-family: "Inter Tight", "Helvetica Neue", Helvetica, "Pretendard Variable", Arial, sans-serif;
  font-size: 12px; line-height: 1.2; font-weight: 500;
}
.dj-ring-count { color: #999999; font-size: 11px; font-weight: 600; }
.dj-card { cursor: zoom-in; }
.dj-card:focus-visible { outline: 1px solid #FFFFFF; outline-offset: 4px; }
/* 호버 — 마블링 일그러짐(dj-ring.js 스프링이 --dj-melt 0→1 을 준다) + 흐림 30%(2.4px)
   녹는 만큼 흐림과 확대가 함께 커진다 */
.dj-ring-section { --dj-blur: 2.4px; }
.dj-card img { transition: transform .9s cubic-bezier(.2, .8, .2, 1); }
.dj-card.is-warp img {
  filter: url(#dj-warp) blur(calc(var(--dj-blur) * var(--dj-melt, 0)));
  transform: scale(calc(1 + .08 * var(--dj-melt, 0)));
}

/* 팝업 크게 보기 — 화면의 90% 창, 뒤는 흐리게. 글자는 readymag 규칙(대문자 · 지금 사진만 파랑 #0000FF) */
html.dj-lb-open { overflow: hidden; }
.dj-lb {
  position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
  font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.15; font-weight: 400; text-transform: uppercase; color: #FFFFFF;
  text-shadow: 0 1px 8px rgba(0, 0, 0, .35);   /* 색 면 없이 흐린 배경 위에서도 글자가 읽히게 */
  -webkit-user-select: none; user-select: none;  /* 빠르게 넘길 때 사진이 '선택'돼 어둡게 덮이던 문제 */
}
.dj-lb[hidden] { display: none; }
.dj-lb-back {
  position: absolute; inset: 0; background: transparent;   /* 배경 색 없이 블러만 (전 18px → 절반 9px) */
  backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
  opacity: 0; transition: opacity .32s ease; cursor: zoom-out;
}
.dj-lb-panel {
  position: relative; width: 90vw; height: 90vh; background: transparent;
  display: grid; grid-template-rows: auto 1fr auto; padding: 16px;
  pointer-events: none;
  opacity: 0; transform: translateY(24px) scale(.96); transition: opacity .32s ease, transform .45s cubic-bezier(.2, .8, .2, 1);
}
.dj-lb.is-in .dj-lb-back { opacity: 1; }
.dj-lb.is-in .dj-lb-panel { opacity: 1; transform: none; }
.dj-lb button { font: inherit; text-transform: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.dj-lb-top { display: flex; justify-content: space-between; align-items: baseline; }
.dj-lb-count { margin: 0; font-variant-numeric: tabular-nums; }
.dj-lb-close { white-space: nowrap; }
.dj-lb-close:hover, .dj-lb-list button:hover { color: #E3262B; }
.dj-lb button:focus { outline: none; }
.dj-lb button:focus-visible { outline: 1px solid currentColor; outline-offset: 3px; }
.dj-lb-count { display: inline-block; will-change: transform; }
.dj-lb-stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; margin: 12px 0; cursor: none; }
.dj-lb-img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block;
  -webkit-user-drag: none; user-select: none; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); }   /* 가운데 · 자르지 않고 창에 꽉 */
.dj-lb-top, .dj-lb-stage, .dj-lb-list { pointer-events: auto; }
.dj-lb-img::selection { background: transparent; }
.dj-lb-arrow {
  position: absolute; left: 50%; top: 50%; translate: -50% -50%; pointer-events: none;
  color: #FFFFFF; font-size: 48px; line-height: 1; text-shadow: 0 0 12px rgba(0, 0, 0, .4); opacity: 0; transition: opacity .15s;
}
.dj-lb-stage.is-hover .dj-lb-arrow { opacity: 1; }
.dj-lb-list { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; flex-wrap: wrap; column-gap: 20px; row-gap: 4px; }
.dj-lb-list button.is-on { color: #E3262B; }   /* 지금 사진 — 파랑 → 사이트 레드 */
@media (max-width: 767px) {
  .dj-lb-panel { width: 94vw; height: 88vh; padding: 12px; }
  .dj-lb { font-size: 12px; }
  .dj-lb-stage { cursor: pointer; }
}

.dj-ring-section{height:100vh!important}.dj-ring{visibility:hidden!important}.dj-lb-back{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:#000!important}.dj-ring-note,.dj-lb-close{display:none!important}.dj-lb-back{cursor:default!important}
</style>

<style>
/* 크게 보기 — C 버전 판(1080×1350 좌표, 판 폭에 맞춰 같은 비율로 줄어듦)과 글자 등장 모션 */
.typo-board{position:relative;overflow:hidden;container-type:inline-size;width:min(100%,calc(84vh * .8));aspect-ratio:1080/1350;flex:none;background:#fff;color:#231f20;border-radius:6px;box-shadow:0 30px 60px -30px rgba(30,39,45,.45),0 0 0 1px var(--soft);transform-origin:0 0}
.typo-board .t{position:absolute;margin:0;left:calc(var(--x) / 1080 * 100%);top:calc(var(--y) / 1350 * 100%);width:calc(var(--w) / 1080 * 100%);font-family:"Noto Serif KR",serif;font-weight:400;font-size:calc(var(--s) / 1080 * 100cqi);letter-spacing:calc(var(--ls,0) / 1080 * 100cqi);line-height:calc(var(--lh) / 1080 * 100cqi);white-space:nowrap;text-wrap:nowrap}
.typo-board .t.sans{font-family:"Noto Sans KR",sans-serif}
.typo-board .t.c{text-align:center}
.typo-board img.t{height:auto}
.typo-board img.t{aspect-ratio:auto;max-height:none;max-width:none;object-fit:fill;border-radius:0;box-shadow:none;background:none}
.typo-board .t.v span{display:block;text-align:center;height:calc(var(--lh) / 1080 * 100cqi);line-height:calc(var(--lh) / 1080 * 100cqi)}
.typo-board .t{opacity:0}
.typo-board.is-in .t{animation-name:var(--anim,t-fade);animation-duration:var(--dur,900ms);animation-delay:calc(var(--d,0) * 1ms + 300ms);animation-timing-function:cubic-bezier(.16,1,.3,1);animation-fill-mode:both}
.typo-board .t[data-m="rise"]{--anim:t-rise;--dur:1200ms}
.typo-board .t[data-m="fall"]{--anim:t-fall;--dur:1200ms}
.typo-board .t[data-m="fade"]{--anim:t-fade}
.typo-board .t[data-m="sharp"]{--anim:t-sharp;--dur:700ms}
.typo-board .t[data-m="blur"]{--anim:t-blur}
.typo-board .t[data-m="wipe"]{--anim:t-wipe}
.typo-board .t[data-m="up"]{--anim:t-up;--dur:800ms}
.typo-board .t[data-m="slow"]{--anim:t-slow}
.typo-board .t[data-m="bloom"]{--anim:t-bloom}
.typo-board .t[data-m="wither"]{--anim:t-wither;animation-timing-function:ease-out}
@keyframes t-fade{from{opacity:0}to{opacity:1}}
/* 01 쓴 것은 아래에서 올라오고, 단 것은 위에서 내려앉는다 */
@keyframes t-rise{from{opacity:0;transform:translateY(8cqi)}to{opacity:1;transform:none}}
@keyframes t-fall{from{opacity:0;transform:translateY(-8cqi)}to{opacity:1;transform:none}}
/* 02 선명한 말은 바로, 흐릿한 말은 흐림에서 천천히 */
@keyframes t-sharp{from{opacity:0;transform:translateY(1.5cqi)}to{opacity:1;transform:none}}
@keyframes t-blur{from{opacity:0;filter:blur(2.4cqi)}40%{opacity:1}to{opacity:1;filter:blur(0)}}
/* 03 기둥을 위에서 아래로 써 내려간다 */
@keyframes t-wipe{from{opacity:1;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
/* 04 앞 네 줄은 한 줄씩, 뒤 네 줄은 잠이 들 듯 느리게 */
@keyframes t-up{from{opacity:0;transform:translateY(1.2cqi)}to{opacity:1;transform:none}}
@keyframes t-slow{from{opacity:0;transform:translateY(1cqi);filter:blur(.4cqi)}to{opacity:1;transform:none;filter:blur(0)}}
/* 05 위 한자는 피었다가 옅어지고, 아래 한자가 이어 핀다 */
@keyframes t-bloom{from{opacity:0;transform:scale(.94);filter:blur(.8cqi)}80%{filter:blur(0)}to{opacity:1;transform:none}}
@keyframes t-wither{0%{opacity:0;transform:scale(.94);filter:blur(.8cqi)}35%{opacity:1;transform:none;filter:blur(0)}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typo-board .t{opacity:1}.typo-board.is-in .t{animation:none}.tm-replay{display:none}}

/* [12주] 9주 책 페이지의 '말 타이포 판' 모션: 크게 보기에서 그림 대신 글자가 하나씩 등장하는 판을 띄운다 */
.dj-lb-stage .typo-board{flex:none;width:var(--bw,60vh);max-width:100%;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);border-radius:4px}
.dj-lb-stage.tm-on .dj-lb-img{position:absolute;opacity:0!important;pointer-events:none}
.tm-replay{font:inherit;text-transform:uppercase;color:inherit;background:none;border:0;padding:0;cursor:pointer;margin-left:auto;margin-right:18px}
.tm-replay:hover{color:#E3262B}
.dj-lb .typo-board,.dj-lb .typo-board *{text-shadow:none}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="grain" x="-40%" y="-180%" width="180%" height="460%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap id="grainMap" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<script>
/* [12주] 크게 보기 그림이 바뀔 때마다 같은 번호의 말 타이포 판을 띄우고 글자 등장 모션을 재생한다(9주 책 페이지와 같은 모션) */
(function(){
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches,gMap=document.getElementById("grainMap"),G={raf:0,timer:0},bd=null;
  function grainStop(){cancelAnimationFrame(G.raf);clearTimeout(G.timer);if(gMap)gMap.setAttribute("scale","0");if(bd)bd.querySelectorAll("[data-grain]").forEach(function(el){el.style.filter=""})}
  function grainStart(b,els){els.forEach(function(el){el.style.filter="url(#grain)"});var t0=performance.now(),sm=function(x){return x*x*(3-2*x)};
    (function tick(now){if(!b.isConnected)return grainStop();var s=((now-t0)/1000)%9,k=s<4?sm(s/4):s<5?1:1-sm((s-5)/4);gMap.setAttribute("scale",(k*b.getBoundingClientRect().width*.15).toFixed(2));G.raf=requestAnimationFrame(tick)})(t0)}
  function play(){grainStop();if(!bd||RM)return;bd.classList.remove("is-in");void bd.offsetWidth;bd.classList.add("is-in");
    var els=[].slice.call(bd.querySelectorAll("[data-grain]"));if(!els.length)return;
    var end=Math.max.apply(null,els.map(function(el){var cs=getComputedStyle(el);return parseFloat(cs.animationDelay)+parseFloat(cs.animationDuration)}));
    G.timer=setTimeout(function(){grainStart(bd,els)},end*1000)}
  function size(){if(!bd)return;var st=bd.parentNode,r=st.getBoundingClientRect();bd.style.setProperty("--bw",Math.max(120,Math.min(r.width,r.height*.8))+"px")}
  function mount(img){var m=/w09_0(\d)\.png/.exec(img.getAttribute("src")||"");var st=img.parentNode;if(!m)return;
    var tpl=document.getElementById("board-0"+m[1]);if(!tpl)return;
    if(bd&&bd.dataset.no===m[1]&&bd.isConnected)return;
    grainStop();if(bd)bd.remove();
    bd=document.createElement("div");bd.className="typo-board";bd.dataset.no=m[1];bd.setAttribute("role","img");bd.setAttribute("aria-label",img.alt||"");bd.innerHTML=tpl.innerHTML;
    st.insertBefore(bd,img);st.classList.add("tm-on");size();
    if(!RM)bd.animate([{opacity:0,transform:"scale(.97)"},{opacity:1,transform:"none"}],{duration:420,easing:"cubic-bezier(.2,.7,.2,1)"});
    play()}
  function init(){var img=document.querySelector(".dj-lb-img");if(!img)return setTimeout(init,120);
    new MutationObserver(function(){mount(img)}).observe(img,{attributes:true,attributeFilter:["src"]});
    if(img.getAttribute("src"))mount(img);
    var top=document.querySelector(".dj-lb-top");if(top&&!RM){var b=document.createElement("button");b.type="button";b.className="tm-replay";b.textContent="↻ Replay";b.addEventListener("click",function(e){e.stopPropagation();play()});var cl=top.querySelector(".dj-lb-close");top.insertBefore(b,cl||null)}
    addEventListener("resize",size)}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
